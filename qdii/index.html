<style>
  :root { --up:#dc2626; --down:#16a34a; --primary:#2563eb; --muted:#6b7280; --border:#e5e7eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:#f5f7fa; color:#111827; padding:16px; }
  .wrap { max-width:1180px; margin:0 auto; }
  .hdr { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:14px; }
  #refreshBtn { padding:8px 18px; font-size:13px; border:none; background:var(--primary); color:#fff; border-radius:8px; cursor:pointer; white-space:nowrap; }
  #refreshBtn:disabled { background:#93c5fd; cursor:wait; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .card .name { font-size:12px; color:var(--muted); }
  .card .val { font-size:20px; font-weight:700; margin:4px 0 2px; }
  .card .val .chg { font-size:13px; font-weight:600; margin-left:8px; }
  .card .date { font-size:11px; color:var(--muted); margin-top:2px; }
  .card .close-line { font-size:11px; color:var(--muted); margin-top:4px; border-top:1px dashed var(--border); padding-top:4px; }
  .card .fut-line { font-size:11px; color:#475569; margin-top:4px; }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--muted); }
  .predict-banner { background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .xhs-block { background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin-bottom:14px; font-size:13px; line-height:1.9; white-space:pre-wrap; }
  .predict-banner b.pred { font-size:16px; }
  .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .toolbar select { padding:6px 10px; font-size:14px; border:1px solid var(--border); border-radius:8px; }
  .fund-summary { font-size:12px; color:var(--muted); }
  .ranges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .ranges button { padding:6px 14px; font-size:13px; border:1px solid var(--border); background:#fff; border-radius:18px; cursor:pointer; }
  .ranges button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  #chart { background:#fff; border:1px solid var(--border); border-radius:10px; height:420px; }
  .range-return { background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px 16px; margin-top:10px; }
  .rr-row { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .rr-row + .rr-row { margin-top:6px; }
  .range-return .label { font-size:13px; color:var(--muted); }
  .range-return .big { font-size:22px; font-weight:700; }
  .range-return .pred-label { font-size:12px; color:#b45309; }
  .range-return .pred-val { font-size:22px; font-weight:700; color:#b45309; }
  .range-return .pred-label2 { font-size:12px; color:#6d28d9; }
  .range-return .pred-val2 { font-size:22px; font-weight:700; color:#6d28d9; }
  .bt-head { display:flex; justify-content:space-between; align-items:baseline; margin:16px 0 6px; flex-wrap:wrap; gap:6px; }
  .bt-head h2 { font-size:15px; }
  .bt-stats { font-size:12px; color:var(--muted); }
  .bt-stats b { color:#111827; }
  .table-box { background:#fff; border:1px solid var(--border); border-radius:10px; max-height:420px; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { padding:6px 10px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap; }
  th { position:sticky; top:0; background:#f9fafb; color:var(--muted); font-weight:600; }
  td:first-child, th:first-child, td:nth-child(2), th:nth-child(2) { text-align:left; }
  tr.pred-row td { background:#fffbeb; }
  .pred-badge { display:inline-block; background:#fef3c7; color:#b45309; font-size:10px; padding:0 6px; border-radius:8px; margin-left:6px; vertical-align:1px; }
  footer { margin-top:16px; font-size:11px; color:var(--muted); line-height:1.7; }
  #loadState { color:var(--primary); font-size:13px; }
  @media (max-width:760px){
    body { padding:10px; }
    .hdr { flex-wrap:wrap; }
    .cards { grid-template-columns:repeat(2,1fr); gap:8px; }
    .card { padding:10px; }
    .card .val { font-size:16px; }
    h1 { font-size:16px; }
    #refreshBtn { padding:6px 12px; font-size:12px; }
    #chart { height:320px; }
    .predict-banner { font-size:12px; line-height:1.7; }
    .range-return .big, .range-return .pred-val, .range-return .pred-val2 { font-size:18px; }
    th, td { padding:5px 6px; font-size:11px; }
  }

  document.getElementById('xhsBlock').textContent = DATA.xhs_text || '';
  const sel = document.getElementById('fundSel');
  sel.innerHTML = DATA.funds.map((f, i) => `<option value="${i}">${f.name}（${f.code}）</option>`).join('');
  sel.value = curFund;
  sel.onchange = () => { curFund = +sel.value; renderPredict(); renderSummary(); renderChart(); renderRangeReturn(); renderBacktest(); };
  renderRanges();
  renderPredict(); renderSummary(); renderChart(); renderRangeReturn(); renderBacktest(); renderFooter();
}

function renderCards() {
  const el = document.getElementById('cards');
  let html = '';
  for (const idx of DATA.indices) {
    const c = idx.close;
    html += `<div class="card"><div class="name">${idx.name}</div>`;
    if (DATA.market_open && idx.current) {
      // 美股盘中：两行——当前价/当前涨跌（实时）+ 收盘价/收盘涨跌
      html += `<div class="val">${idx.current.price.toFixed(2)}<span class="chg ${pctCls(idx.current.chg_pct)}">${pctText(idx.current.chg_pct)}</span></div>
        <div class="date">当前 · ${idx.current.quote_time}（北京时间）</div>
        <div class="close-line">收盘 ${c.price.toFixed(2)}（<span class="${pctCls(c.chg)}">${pctText(c.chg)}</span>）· ${fmtDate(c.date)}</div>`;
    } else {
      // 美股休市或实时报价不可用：只显示收盘行，避免"当前=收盘"重复误导
      const note = DATA.market_open ? '实时报价不可用' : '美股休市 · 当前价=最近收盘价';
      html += `<div class="val">${c.price.toFixed(2)}<span class="chg ${pctCls(c.chg)}">${pctText(c.chg)}</span></div>
        <div class="date">${note} · ${fmtDate(c.date)}</div>`;
    }
    // 期货实时（CME 近 24 小时交易，休市时段仍在跳动，指示今夜开盘方向）
    if (idx.futures) {
      const f = idx.futures;
      html += `<div class="fut-line">${idx.key === 'NDX' ? '纳指100期货' : '标普500期货'} ${f.price.toFixed(2)}（<span class="${pctCls(f.chg_pct)}">${pctText(f.chg_pct)}</span>）· ${f.quote_time}</div>`;
    }
    html += `</div>`;
  }
  if (DATA.fx) {
    html += `<div class="card"><div class="name">美元兑人民币（中间价）</div>
      <div class="val">${DATA.fx.value.toFixed(4)}<span class="chg ${pctCls(DATA.fx.chg)}">${pctText(DATA.fx.chg)}</span></div>
      <div class="date">当前 · ${fmtDate(DATA.fx.date)}</div>`;
    if (DATA.fx.spot) {
      const s = DATA.fx.spot;
      html += `<div class="fut-line">在岸现汇 ${s.price.toFixed(4)}（<span class="${pctCls(s.chg_pct)}">${pctText(s.chg_pct)}</span>）· ${s.quote_time}</div>`;
    }
    html += `<div class="close-line">${DATA.fx.source}</div></div>`;
  } else {
    html += `<div class="card"><div class="name">美元兑人民币</div>
      <div class="val flat">—</div><div class="date flat">汇率数据不可用，模拟未含汇率变动</div></div>`;
  }
  el.innerHTML = html;
  document.getElementById('generated').textContent = `数据时间 ${DATA.generated}`;
}

function renderPredict() {
  const f = DATA.funds[curFund];
  const el = document.getElementById('predict');
  if (!f.prediction) { el.innerHTML = '预测数据不可用'; return; }
  const p = f.prediction;
  const note = p.state === 'provisional' ? '（目标净值日的美股收盘尚未产生，暂以最新收盘估算）' : '';
  const fxPart = DATA.fx ? ` × 汇率变动 ${pctText(p.fx_ret)}` : '';
  let livePart = '';
  const p2 = f.prediction2;
  if (p2) {
    const fx2Part = DATA.fx ? ` × 汇率 ${pctText(p2.fx_ret)}` : '';
    livePart = ` ｜ 再下一期 <b>${fmtDate(p2.nav_date)}</b>：${p2.source} ${pctText(p2.bench_ret)}${fx2Part}
      → <b class="pred ${pctCls(p2.pred_ret)}">${pctText(p2.pred_ret)}</b>`;
  }
  el.innerHTML = `<b>下期净值预测</b> ｜ ${f.name}（${f.code}）：净值日 <b>${fmtDate(p.nav_date)}</b>
    对应美股收盘 <b>${fmtDate(p.us_day)}</b> · ${f.bench_name} ${pctText(p.bench_ret)}${fxPart}
    → 预测日收益率 <b class="pred ${pctCls(p.pred_ret)}">${pctText(p.pred_ret)}</b>${note}${livePart}`;
}

function renderSummary() {
  const f = DATA.funds[curFund];
  const p = f.prediction;
  document.getElementById('fundSummary').textContent =
    `最新净值 ${fmtDate(f.last_nav_date)}（官方日收益 ${f.last_off_ret == null ? '—' : pctText(f.last_off_ret)}）` +
    (p ? ` ｜ 回测映射: ${f.backtest.desc}，近${f.backtest.n}日误差均值 ${pctText(f.backtest.mean_err)} / 最大 ${pctText(f.backtest.max_err)}` : '');
}

function renderRanges() {
  const el = document.getElementById('ranges');
  el.innerHTML = DATA.windows.map(w =>
    `<button data-k="${w.key}" class="${w.key === curRange ? 'active' : ''}">${w.label}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { curRange = b.dataset.k; renderRanges(); renderChart(); renderRangeReturn(); });
}

function renderChart() {
  const f = DATA.funds[curFund];
  const w = f.windows[curRange];
  const dates = w.dates, cum = w.cum;
  const hist = dates.map((d, i) => [d, cum[i]]);
  // 预测链：预测点1=收盘口径（下一期净值）；预测点2=实时口径（期货/盘中现货，再下一期）
  const p = f.prediction, p2 = f.prediction2;
  const series = [
    { name: '累计收益率', type: 'line', data: hist, showSymbol: false, lineStyle: { width: 2, color: '#2563eb' },
      itemStyle: { color: '#2563eb' }, z: 2 },
  ];
  if (p && dates.length) {
    const lastCum = cum[cum.length - 1];
    const lastPt = [dates[dates.length - 1], lastCum];
    const cum1 = (1 + lastCum) * (1 + p.pred_ret) - 1;
    const pt1 = [fmtDate(p.nav_date), cum1];
    series.push({ name: '预测（收盘）', type: 'line',
      data: [
        { value: lastPt, symbol: 'none', label: { show: false } },
        // 1px 微型圆点作为 label 锚点（视觉不可见）；标签放点下方与实时口径错开
        { value: pt1, symbol: 'circle', symbolSize: 1,
          label: { show: true, formatter: () => pctText(p.pred_ret), color: '#b45309', fontSize: 12, position: 'bottom' } },
      ],
      lineStyle: { width: 2, color: '#f59e0b' }, itemStyle: { color: '#f59e0b' }, z: 3 });
    if (p2) {
      const cum2 = (1 + cum1) * (1 + p2.pred_ret) - 1;
      const pt2 = [fmtDate(p2.nav_date), cum2];
      series.push({ name: '预测（实时）', type: 'line',
        data: [
          { value: pt1, symbol: 'none', label: { show: false } },
          { value: pt2, symbol: 'circle', symbolSize: 1,
            label: { show: true, formatter: () => pctText(p2.pred_ret), color: '#6d28d9', fontSize: 12, position: 'top' } },
        ],
        lineStyle: { width: 2, color: '#8b5cf6' }, itemStyle: { color: '#8b5cf6' }, z: 3 });
    }
  }
  // X 轴标签格式随窗口跨度自适应：短窗口（≤100天）用 MM-DD，长窗口用 YYYY-MM；hideOverlap 自动隐藏重叠
  const spanDays = dates.length > 1 ? (new Date(dates[dates.length - 1]) - new Date(dates[0])) / 86400000 : 0;
  const dailyFmt = spanDays <= 100;
  const two = n => String(n).padStart(2, '0');
  const option = {
    animation: false,
    tooltip: { trigger: 'axis',
      // 历史点只显示累计收益率；预测点同样显示累计收益率但标注预测口径
      formatter: ps => {
        const hit = ps.find(x => x.seriesName === '累计收益率');
        if (hit) return `${fmtDate(hit.value[0])}<br/>累计收益率: <b>${pctText(hit.value[1])}</b>`;
        const close = ps.find(x => x.seriesName === '预测（收盘）');
        const live = ps.find(x => x.seriesName === '预测（实时）');
        const pick = close || live;
        if (!pick) return '';
        const tag = close ? '预测·收盘' : '预测·实时';
        return `${fmtDate(pick.value[0])}<br/>累计收益率: <b>${pctText(pick.value[1])}</b>（${tag}）`;
      } },
    legend: { show: series.length > 1, top: 6, right: 10, icon: 'rect', itemWidth: 14, itemHeight: 3 },
    grid: { left: 56, right: 44, top: 34, bottom: 46 },
    xAxis: { type: 'time', min: 'dataMin', max: 'dataMax',
      axisLabel: { hideOverlap: true, fontSize: 11,
        formatter: v => { const d = new Date(v);
          return dailyFmt ? `${two(d.getMonth() + 1)}-${two(d.getDate())}`
                          : `${d.getFullYear()}-${two(d.getMonth() + 1)}`; } } },
    yAxis: { type: 'value', axisLabel: { formatter: v => (v * 100).toFixed(1) + '%' },
      splitLine: { lineStyle: { color: '#f3f4f6' } }, scale: true },
    dataZoom: [{ type: 'inside' }, { type: 'slider', height: 18, bottom: 8 }],
    series,
  };
  if (!chart) chart = echarts.init(document.getElementById('chart'));
  chart.setOption(option, true);
  chart.resize();
}

function renderRangeReturn() {
  const f = DATA.funds[curFund];
  const w = f.windows[curRange];
  const el = document.getElementById('rangeReturn');
  const wLabel = (DATA.windows.find(x => x.key === curRange) || {}).label || curRange;
  if (!w || !w.dates.length) { el.innerHTML = ''; return; }
  // 区间起点恒为 0.00%（基期净值），区间收益率 = 终点累计收益
  const ret = w.cum[w.cum.length - 1];
  const end = fmtDate(w.dates[w.dates.length - 1]);
  const p = f.prediction, p2 = f.prediction2;
  let pred1Html = '', row2 = '';
  if (p) {
    const predCum1 = (1 + ret) * (1 + p.pred_ret) - 1;
    pred1Html = `<span class="pred-label">含下期预测（收盘）（${fmtDate(p.nav_date)}）</span>` +
      `<span class="pred-val">${pctText(predCum1)}</span>`;
    if (p2) {
      // 第二行：实时口径（在收盘口径基础上再链入下下期预测）
      const predCum2 = (1 + predCum1) * (1 + p2.pred_ret) - 1;
      row2 = `<div class="rr-row"><span class="pred-label2">含下期预测（实时）（${fmtDate(p2.nav_date)}）</span>` +
        `<span class="pred-val2">${pctText(predCum2)}</span></div>`;
    }
  }
  el.innerHTML = `<div class="rr-row">` +
    `<span class="label">${wLabel}区间收益率（起点 ${fmtDate(w.base_date)} = 0.00% → 终点 ${end}）</span>` +
    `<span class="big ${pctCls(ret)}">${pctText(ret)}</span>${pred1Html}</div>${row2}`;
}

function renderBacktest() {
  const f = DATA.funds[curFund];
  const bt = f.backtest;
  document.getElementById('btStats').innerHTML =
    `映射: <b>${bt.desc}</b>（自动回测判定） ｜ 样本 <b>${bt.n}</b> 日 ｜ 误差均值 <b>${pctText(bt.mean_err)}</b> ｜ 最大 <b>${pctText(bt.max_err)}</b>`;
  const rows = bt.rows.slice().reverse();
  let html = `<thead><tr><th>净值日期</th><th>美股交易日</th><th>纳指100涨跌</th><th>标普500涨跌</th><th>汇率变动</th>
    <th>模拟日收益</th><th>官方日收益</th><th>误差(pp)</th></tr></thead><tbody>`;
  // 最新一期净值尚未公布：把预测行放在表首（橙色标记，官方列为"待公布"）
  const p0 = f.prediction;
  if (p0) {
    html += `<tr class="pred-row"><td>${fmtDate(p0.nav_date)}<span class="pred-badge">预测</span></td>
      <td>${fmtDate(p0.us_day)}</td>
      <td class="${pctCls(p0.ndx_ret)}">${pctText(p0.ndx_ret)}</td>
      <td class="${pctCls(p0.spx_ret)}">${pctText(p0.spx_ret)}</td>
      <td class="${pctCls(p0.fx_ret)}">${DATA.fx ? pctText(p0.fx_ret) : '—'}</td>
      <td class="${pctCls(p0.pred_ret)}">${pctText(p0.pred_ret)}</td>
      <td class="flat">待公布</td><td class="flat">—</td></tr>`;
  }
  for (const r of rows) {
    const errAbs = Math.abs(r.err);
    const errCls = errAbs > 0.005 ? 'up' : (errAbs > 0.002 ? '' : 'flat');
    html += `<tr><td>${fmtDate(r.t)}</td><td>${fmtDate(r.us_day) || '节假日'}</td>
      <td class="${pctCls(r.ndx)}">${pctText(r.ndx)}</td>
      <td class="${pctCls(r.spx)}">${pctText(r.spx)}</td>
      <td class="${pctCls(r.fx)}">${DATA.fx ? pctText(r.fx) : '—'}</td>
      <td class="${pctCls(r.sim)}">${pctText(r.sim)}</td>
      <td class="${pctCls(r.off)}">${pctText(r.off)}</td>
      <td class="${errCls}">${(r.err * 100).toFixed(2)}</td></tr>`;
  }
  document.getElementById('btTable').innerHTML = html + '</tbody>';
}

function renderFooter() {
  document.getElementById('footer').innerHTML =
    `数据来源：基金净值 - 天天基金（akshare fund_open_fund_info_em）；美股指数 - 新浪财经（akshare index_us_stock_sina）；` +
    `汇率 - ${DATA.fx ? DATA.fx.source : '不可用'}；期货/现汇实时 - 新浪财经（CME E-mini 期货）。数据时间 ${DATA.generated}。<br/>` +
    `提示：期货与现汇为新浪免费实时源，与其他 APP 的涨跌幅可能存在零点几 pp 的口径差异（昨收结算价/收盘价基准、合约月份选择不同所致）。<br/>` +
    `免责声明：预测为乘性近似估算，未建模 QDII 溢价、申购费与跟踪误差常数项，非官方净值；仅供个人参考，不构成投资建议。`;
}

window.addEventListener('resize', () => chart && chart.resize());
renderAll();
</script>
